[package]
name = "umbrachat-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.1", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.4"
rand = "0.9"
tower = { version = "0.5.3", features = ["util"] }
